name: Crawl

# Scheduled batch crawling, not continuous crawling.
#
# GitHub Actions is for building, testing and deploying this project — a
# permanently-running crawler is outside that, and unlimited public-repo minutes
# do not change it. Six bounded batches a day keeps this defensible, is politer
# to the sites being crawled, and still advances the whole 260-topic list roughly
# every four days at the default batch size.
#
# For genuinely constant crawling, run crawl_batch.sh in a loop on a machine you
# control — the script is host-agnostic and takes the same environment.

on:
  schedule:
    # :17 rather than :00 — scheduled runs are delayed or dropped at the top of
    # the hour when Actions is under load.
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Topics to crawl this run'
        required: false
        default: '10'
      limit:
        description: 'Pages per topic'
        required: false
        default: '60'

# Never let two crawls write the same state file. A queued run waits rather than
# cancelling, so a scheduled batch is not lost to a manual one.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write        # to commit .crawl-state and crawl-log.md

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a stuck fetch must not burn a 6-hour job slot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install upload dependencies
        run: pip install -r requirements.txt

      - name: Verify Turso credentials are configured
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          if [ -z "$TURSO_URL" ] || [ -z "$TURSO_TOKEN" ]; then
            echo "::error::TURSO_URL and TURSO_TOKEN must be set as repository secrets."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "credentials present"

      - name: Crawl batch and publish
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
          LIMIT: ${{ github.event.inputs.limit || '60' }}
        run: bash crawl_batch.sh

      - name: Commit crawl state
        run: |
          if git diff --quiet -- .crawl-state crawl-log.md 2>/dev/null; then
            echo "no state change to commit"
            exit 0
          fi
          git config user.name  "magellan-crawler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .crawl-state crawl-log.md
          git commit -m "crawl: batch through topic $(cat .crawl-state)"
          # Another run may have pushed while this one crawled.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Crawl batch"
            echo ""
            echo "Next topic index: \`$(cat .crawl-state 2>/dev/null || echo 'unset')\`"
            echo ""
            tail -5 crawl-log.md 2>/dev/null || echo "(no log yet)"
          } >> "$GITHUB_STEP_SUMMARY"

# (re-indexed after initial push)
