# Infection Research Crawler Configuration
# This file contains specialized settings for infection, virus, and bacteria research

[infection_research]
# Enable specialized infection research mode
enabled = true

# Crawling depth for infection-related content
depth = 3

# Maximum pages to crawl in infection research mode
max_pages = 1000

# Delay between requests (in milliseconds) to be respectful to servers
delay_ms = 2000

# User agent string for infection research crawler
user_agent = MagellanInfectionResearch/1.0 (Specialized crawler for infectious disease research; +https://github.com/magellan-spider)

# Infection-specific keywords to prioritize
priority_keywords = virus,bacteria,pathogen,infection,disease,epidemic,pandemic,vaccine,immunology,virology,bacteriology,microbiology,antibiotic resistance,emerging infectious diseases

# Domains to prioritize for infection research
authoritative_domains = who.int,cdc.gov,nih.gov,niaid.nih.gov,fda.gov,ema.europa.eu,pasteur.fr,imperial.ac.uk,harvard.edu,yale.edu,rockefeller.edu,sanger.ac.uk,broadinstitute.org,nature.com,sciencedirect.com,nejm.org,jamanetwork.com,asm.org

# File types to prioritize for scientific data
scientific_file_types = pdf,doc,docx,xls,xlsx,ppt,pptx,csv,json,xml,fasta,fastq,gb,gbk,fna,faa

# Bioengineering-specific keywords
bioengineering_keywords = synthetic biology,CRISPR,gene editing,genetic engineering,metabolic engineering,protein engineering,biosensor,nanotechnology,microfluidics,lab-on-a-chip,organ-on-a-chip,3D bioprinting,tissue engineering,synthetic vaccines,DNA vaccines,mRNA vaccines,AI-driven design,machine learning,drug discovery

# Data quality settings
min_data_quality_score = 50

# Crawling behavior
follow_infection_links_only = false
prioritize_scientific_content = true

# Source authority scoring
[source_authority]
government_sources = who.int,cdc.gov,nih.gov,fda.gov,gov.uk,gov.au,gc.ca,ecdc.europa.eu,ema.europa.eu
high_authority_domains = nature.com,science.org,cell.com,nejm.org,jamanetwork.com,lancet.com,pnas.org,plos.org
academic_sources = edu,ac.uk,ac.jp,ac.kr,ac.il,ac.za,ac.in,ac.cn,ac.ir
health_organizations = who.int,cdc.gov,ecdc.europa.eu,health.gov.au,health.gov.uk,healthcanada.gc.ca
bioengineering_sources = igem.org,addgene.org,biobricks.org,jbei.org,synberc.org
